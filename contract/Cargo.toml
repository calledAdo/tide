[package]
name = "tide"
description = "$TIDE: a NEP-141 memecoin whose supply is a fish stock governed by Athenian ostracism"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/calledAdo/tide"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
